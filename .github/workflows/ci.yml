name: ci
on: [push, pull_request]
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install source-check assembler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nasm
      - name: source checks and both real assembly variants (no Turbo C or originals)
        run: make check-source
  exact:
    # Separately licensed Turbo C 2.0, DOSBox-X and NASM must be provisioned.
    # The checker stages only declared compiler/header/runtime inputs and copies
    # source files, never ignored game/build output from a persistent runner.
    if: ${{ vars.DAC_SELF_HOSTED == 'true' }}
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: original-free clean build and both whole-executable hashes
        run: make check-exact
